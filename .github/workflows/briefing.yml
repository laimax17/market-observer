name: daily-briefing

# 每个工作日美股盘前跑一次，外加一个手动触发按钮（Actions 页面的 "Run workflow"）。
on:
  schedule:
    # 12:00 UTC ≈ 美东 08:00。GitHub 的定时触发可能延迟最多 ~15 分钟，盘前无所谓。
    - cron: "0 12 * * 1-5"
  workflow_dispatch: {}

# 同一时间只跑一个，避免手动触发和定时撞车。
concurrency:
  group: daily-briefing
  cancel-in-progress: false

# 需要写权限，才能把当天的简报 push 到 briefings 分支（main 只存代码）。
permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 密钥从仓库 Secrets 注入（Settings → Secrets and variables → Actions）。
      # 没设的话程序会优雅降级：没 LLM key → 纯数据；没 webhook → 只存档不推送。
      MO_DEEPSEEK_API_KEY: ${{ secrets.MO_DEEPSEEK_API_KEY }}
      MO_DISCORD_WEBHOOK_URL: ${{ secrets.MO_DISCORD_WEBHOOK_URL }}
      # 简报先写进 runner 工作区的 briefings/（临时），随后 publish 步骤把它 push 到
      # 专门的 briefings 分支。main 分支只存代码，不存报告。
      MO_OUTPUT_DIR: briefings
      MO_PINNED_SYMBOLS: SPY,QQQ
      MO_WATCHLIST_SIZE: "10"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Provision Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Generate briefing
        run: uv run python -m market_observer.run_briefing

      # 把生成的报告 push 到独立的 briefings 分支（不碰 main）。用 git worktree 把
      # briefings 分支 checkout 到另一个目录，只在那里提交报告文件。
      - name: Publish briefing to the briefings branch
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(briefings/briefing_*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no briefing file produced — nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin briefings
          git worktree add ../briefings-pub origin/briefings
          mkdir -p ../briefings-pub/briefings
          cp "${files[@]}" ../briefings-pub/briefings/
          cd ../briefings-pub
          git checkout -B briefings
          git add briefings/
          if git diff --cached --quiet; then
            echo "no new briefing to commit"
            exit 0
          fi
          git commit -m "briefing: $(date -u +%Y-%m-%d)"
          git push origin briefings
